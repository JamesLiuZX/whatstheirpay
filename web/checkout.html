<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · WhatsTheirPay</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <header class="nav scrolled">
    <div class="container nav-inner">
      <a class="brand" href="/" aria-label="WhatsTheirPay home"><img src="/assets/img/logo.svg" alt="" width="30" height="30"><span class="wordmark">whats<em>their</em>pay</span></a>
    </div>
  </header>
  <main class="page">
    <div class="container page-narrow">
      <span class="kicker">Test checkout</span>
      <h1 class="display">Complete your upgrade</h1>
      <section class="panel" id="summary">
        <div class="panel-row">
          <div><h2 id="item">Pro</h2><p class="muted" id="item-note"></p></div>
          <strong id="price" class="price"></strong>
        </div>
        <p class="dev-note">Stripe isn't configured on this server, so this built-in checkout applies the plan instantly. No card is charged. Set STRIPE_SECRET_KEY to use real Stripe Checkout.</p>
        <p class="form-error" id="error" hidden></p>
        <div class="btn-row">
          <button class="btn btn-brand btn-lg" type="button" id="pay">Complete test purchase</button>
          <a class="btn btn-ghost btn-lg" href="/#pricing">Cancel</a>
        </div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/js/api.js" defer></script>
  <script src="/assets/js/checkout.js" defer></script>
</body>
</html>
